<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-label="Ramy Benali — développeur full stack. Stage à partir de mars 2027 en Île-de-France.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1620"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .k{fill:#7ee787}.s{fill:#a5d6ff}.p{fill:#8b949e}
      .in{animation:in .5s ease-out both}
      .l{animation:in .35s ease-out both}
      @keyframes in{from{opacity:0;transform:translateY(6px)}}
      .cover{transform-box:fill-box;transform-origin:right center;transform:scaleX(0);animation:type 1.5s steps(33,end) .5s both}
      @keyframes type{from{transform:scaleX(1)}to{transform:scaleX(0)}}
      .cur{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
      @keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(3.2);opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect x="1" y="1" width="838" height="378" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="1" width="838" height="378" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="838" height="378" rx="14" fill="url(#glow)"/>

  <!-- Identité -->
  <g class="in" style="animation-delay:.05s">
    <text x="48" y="92" class="mono" font-size="13" fill="#3fb950" letter-spacing="1">// full stack developer</text>
  </g>
  <g class="in" style="animation-delay:.15s">
    <text x="46" y="150" class="sans" font-size="50" font-weight="700" fill="#f0f6fc" letter-spacing="-1.5">Ramy Benali</text>
  </g>
  <g class="in" style="animation-delay:.3s">
    <text class="sans" font-size="16" fill="#9198a1">
      <tspan x="48" y="192">Je construis des SaaS qui encaissent</tspan>
      <tspan x="48" y="216">de l'argent, sans casser la prod.</tspan>
    </text>
  </g>
  <g class="in mono" style="animation-delay:.45s" font-size="12" fill="#c9d1d9">
    <rect x="48" y="246" width="76" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="86" y="264.5" text-anchor="middle">Laravel</text>
    <rect x="132" y="246" width="100" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="182" y="264.5" text-anchor="middle">TypeScript</text>
    <rect x="240" y="246" width="122" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="301" y="264.5" text-anchor="middle">Stripe Connect</text>
  </g>
  <g class="in" style="animation-delay:.6s">
    <circle class="pulse" cx="54" cy="320" r="4" fill="#3fb950"/>
    <circle cx="54" cy="320" r="4" fill="#3fb950"/>
    <text x="70" y="325" class="sans" font-size="14" fill="#c9d1d9">Stage · mars 2027 · Île-de-France</text>
  </g>

  <!-- Terminal -->
  <g class="in" style="animation-delay:.2s">
    <rect x="432" y="44" width="368" height="292" rx="10" fill="#010409" stroke="#30363d"/>
    <path d="M432 80h368" stroke="#21262d"/>
    <circle cx="454" cy="62" r="5" fill="#f85149" fill-opacity=".85"/>
    <circle cx="472" cy="62" r="5" fill="#d29922" fill-opacity=".85"/>
    <circle cx="490" cy="62" r="5" fill="#3fb950" fill-opacity=".85"/>
    <text x="616" y="66.5" text-anchor="middle" class="mono" font-size="11.5" fill="#6e7681">ramy — zsh</text>
  </g>
  <g class="mono" font-size="13">
    <text x="452" y="112" fill="#3fb950">$</text>
    <text x="470" y="112" fill="#f0f6fc" textLength="264" lengthAdjust="spacingAndGlyphs">curl ramy-benali.pages.dev/api/ramy</text>
    <rect class="cover" x="468" y="98" width="270" height="20" fill="#010409"/>
    <g xml:space="preserve">
      <text class="l p" style="animation-delay:2.15s" x="452" y="144">{</text>
      <text class="l" style="animation-delay:2.27s" x="452" y="168"><tspan class="k">  "role"</tspan><tspan class="p">: </tspan><tspan class="s">"full stack developer"</tspan><tspan class="p">,</tspan></text>
      <text class="l" style="animation-delay:2.39s" x="452" y="192"><tspan class="k">  "company"</tspan><tspan class="p">: </tspan><tspan class="s">"Frog Tech"</tspan><tspan class="p">,</tspan></text>
      <text class="l" style="animation-delay:2.51s" x="452" y="216"><tspan class="k">  "stack"</tspan><tspan class="p">: [</tspan><tspan class="s">"laravel"</tspan><tspan class="p">, </tspan><tspan class="s">"typescript"</tspan><tspan class="p">],</tspan></text>
      <text class="l" style="animation-delay:2.63s" x="452" y="240"><tspan class="k">  "building"</tspan><tspan class="p">: </tspan><tspan class="s">"stripe connect"</tspan><tspan class="p">,</tspan></text>
      <text class="l" style="animation-delay:2.75s" x="452" y="264"><tspan class="k">  "next"</tspan><tspan class="p">: </tspan><tspan class="s">"stage 03/2027"</tspan></text>
      <text class="l p" style="animation-delay:2.87s" x="452" y="288">}</text>
    </g>
    <text class="l" style="animation-delay:3.1s" x="452" y="316" fill="#3fb950">$</text>
    <rect class="cur" x="470" y="304" width="8" height="15" fill="#c9d1d9"/>
  </g>
</svg>
